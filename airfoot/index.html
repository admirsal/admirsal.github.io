  <script id="airfoot-codec-script">
    /**
     * Stage 7 Bidirectional SysEx Codec & State Store
     * Matches Stage 6 firmware (`preset_store.c`) byte-for-byte:
     * Write (0x01): F0 7D 01 <bank> <sw> <gest> <type> <ch_mod> <code> <val_on> <val_off> <csum> F7 (13B)
     * Read  (0x02): F0 7D 02 <bank> <sw> <gest> F7 (7B)
     * Dump  (0x03): F0 7D 03 <bank> <sw> <gest> <type> <ch_mod> <code> <val_on> <val_off> <csum> F7 (13B)
     * ACK   (0x04): F0 7D 04 <bank> <sw> <gest> <status> F7 (8B)
     * Bank  (0x05): F0 7D 05 <bank> F7 (5B)
     */
    const AirFootCodec = (function () {
      const MIDI_SERVICE_UUID = "03b80e5a-ede8-4b33-a751-6ce34ec4c700";
      const MIDI_CHAR_UUID    = "7772e5db-3868-4112-a1a9-f2669d106bf3";
      const BAS_SERVICE_UUID  = 0x180f;
      const BAS_CHAR_UUID     = 0x2a19;

      const ACTION_NAMES = [
        "None", "MIDI CC Toggle", "MIDI CC Momentary",
        "MIDI PC", "MIDI Note", "HID Key", "HID Media", "MCU transport command"
      ];

      const CC_NAMES = {1:"Modulation", 2:"Breath", 4:"Foot controller", 5:"Portamento time", 7:"Channel volume", 8:"Balance", 10:"Pan", 11:"Expression", 64:"Sustain", 65:"Portamento", 66:"Sostenuto", 67:"Soft pedal", 71:"Resonance", 72:"Release time", 73:"Attack time", 74:"Brightness", 91:"Reverb", 93:"Chorus", 120:"All sound off", 121:"Reset controllers", 123:"All notes off"};
      const KEY_NAMES = {40:"Enter", 41:"Escape", 42:"Backspace", 43:"Tab", 44:"Space", 79:"Right arrow", 80:"Left arrow", 81:"Down arrow", 82:"Up arrow"};
      for (let i = 0; i < 26; i++) KEY_NAMES[4 + i] = String.fromCharCode(65 + i);
      const MEDIA_NAMES = {176:"Play", 177:"Pause", 181:"Next track", 182:"Previous track", 183:"Stop", 205:"Play / Pause", 226:"Mute", 233:"Volume up", 234:"Volume down"};
      const MCU_NAMES = {81:"Undo",86:"Cycle",89:"Click",91:"Rewind",92:"Fast Forward",93:"Stop",94:"Play",95:"Record"};
      function controlName(type, code, high = 0) {
        if (type === 7) return MCU_NAMES[code] || "Unsupported MCU command";
        if (type === 1 || type === 2) return CC_NAMES[code] ? `CC ${code} · ${CC_NAMES[code]}` : `CC ${code}`;
        if (type === 5) return KEY_NAMES[code] || `Key 0x${code.toString(16).padStart(2,"0").toUpperCase()}`;
        if (type === 6) { const usage = code | (high << 8); return MEDIA_NAMES[usage] || `Media 0x${usage.toString(16).padStart(4,"0").toUpperCase()}`; }
        return type === 3 ? `Program ${code}` : type === 4 ? `Note ${code}` : "Unassigned";
      }

      function xorChecksum(bytes8) {
        if (!bytes8 || bytes8.length !== 8) {
          throw new Error("xorChecksum requires exactly 8 payload bytes");
        }
        let x = 0;
        for (let i = 0; i < 8; i++) {
          x ^= (bytes8[i] & 0x7f);
        }
        return x & 0x7f;
      }

      function encodeWriteMapping(slot, fullBytes = false) {
        const payload = [
          slot.bank & 0x7f,
          slot.sw & 0x7f,
          slot.gesture & 0x7f,
          slot.type & 0x7f,
          slot.chan_or_mod & 0x7f,
          slot.code & 0x7f,
          slot.val_on & 0x7f,
          slot.val_off & 0x7f
        ];
        if (fullBytes) {
          payload.push([slot.chan_or_mod, slot.code, slot.val_on, slot.val_off].reduce((bits,v,i) => bits | ((v >> 7) & 1) << i, 0));
          return [0xf0,0x7d,0x0b,...payload,payload.reduce((x,v) => x ^ v,0),0xf7];
        }
        const csum = xorChecksum(payload);
        return [0xf0, 0x7d, 0x01, ...payload, csum, 0xf7];
      }

      function encodeReadRequest(bank, sw, gesture, fullBytes = false) {
        return [0xf0, 0x7d, fullBytes ? 0x0c : 0x02, bank & 0x7f, sw & 0x7f, gesture & 0x7f, 0xf7];
      }

      function encodeSelectBank(bank) {
        return [0xf0, 0x7d, 0x05, bank & 0x7f, 0xf7];
      }

      function validProfile(profile) {
        return profile && bounded(profile.bank, 7) && bounded(profile.kind, 1) &&
          typeof profile.name === "string" && profile.name.length <= 15 &&
          Array.from(profile.name).every(c => c.charCodeAt(0) >= 32 && c.charCodeAt(0) <= 126);
      }
      function encodeReadProfile(bank) {
        if (!bounded(bank, 7)) throw new Error("Invalid profile bank");
        return [0xf0,0x7d,0x22,1,bank,0xf7];
      }
      function encodeWriteProfile(profile) {
        if (!validProfile(profile)) throw new Error("Invalid profile: use at most 15 printable ASCII characters");
        const payload = [1,profile.bank,profile.kind,profile.name.length,...Array.from(profile.name, c => c.charCodeAt(0))];
        return [0xf0,0x7d,0x24,...payload,payload.reduce((x,v) => x ^ v,0),0xf7];
      }

      function wrapBleMidiSysEx(sysexBytes, timestampMs = 0) {
        if (!sysexBytes || sysexBytes[0] !== 0xf0 || sysexBytes[sysexBytes.length - 1] !== 0xf7) {
          throw new Error("Invalid SysEx array passed to wrapBleMidiSysEx");
        }
        const ms = timestampMs & 0x1fff;
        const hdr = 0x80 | ((ms >> 7) & 0x3f);
        const tsLow = 0x80 | (ms & 0x7f);
        const body = sysexBytes.slice(0, sysexBytes.length - 1);
        return [hdr, tsLow, ...body, tsLow, 0xf7];
      }

      /* 20-byte BLE-MIDI packets work with the minimum ATT MTU (23).
       * SysEx continuation packets omit the initial timestamp. */
      function splitBleMidiSysEx(sysexBytes, timestampMs = 0, maxSize = 20) {
        const bytes=Array.from(sysexBytes || []);
        if(bytes.length<2 || bytes[0]!==0xf0 || bytes.at(-1)!==0xf7 ||
           !bytes.slice(1,-1).every(v=>bounded(v,127)) ||
           !Number.isInteger(maxSize)||maxSize<5)
          throw Error("Invalid BLE SysEx frame or packet size");
        const ms=timestampMs&0x1fff,hdr=0x80|((ms>>7)&0x3f),ts=0x80|(ms&0x7f);
        const body=bytes.slice(0,-1),packets=[];
        let offset=0;
        while(offset<body.length){
          const packet=offset===0?[hdr,ts]:[hdr];

          for(const packet of AirFootCodec.splitBleMidiSysEx(sysexFrame,performance.now()))
            await bleMidiChar.writeValueWithoutResponse(new Uint8Array(packet));
        } else if (webMidiOut && webMidiIn && webMidiOut.state !== "disconnected" && webMidiIn.state !== "disconnected") {
          webMidiOut.send(sysexFrame);
        } else {
          throw new Error("No connected AirFoot transport");
        }
      }

      function AirFootCodecBounds(parsed) {
        return Number.isInteger(parsed.bank) && parsed.bank >= 0 && parsed.bank < 8 &&
          (parsed.sw === undefined || (parsed.sw >= 0 && parsed.sw < 5)) &&
          (parsed.gesture === undefined || (parsed.gesture >= 0 && parsed.gesture <= (parsed.kind === "ACTION_EVENT" ? 3 : 2))) &&
          (parsed.kind !== "READ_DUMP" || AirFootCodec.validAction(parsed, parsed.cmd !== 0x0d));
      }
      function handleIncomingMidiPacket(bytes, transport = "ble") {
        if (!bytes || bytes.length === 0) return;

        const channel = AirFootCodec.decodeChannel(bytes, transport);
        if (channel) {
          const {command, code, value} = channel;
          const ch = channel.channel + 1;
          if (command === 0xb0 && !expressionTelemetry && expressionMapping &&
              expressionMapping.bank === appState.activeBank && expressionMapping.channel === channel.channel && expressionMapping.cc === code) {
            showExpression(expressionMapping.bank, channel.channel, code, value);
          }
          logText(`RX MIDI: Ch ${ch}, status ${command.toString(16)}, code ${code}, value ${value ?? ""}`);
          return;
        }

        // 3. SysEx Frame Decoding
        // Strip BLE-MIDI headers and intermediate timestamps for uniform display and processing
        const cleanBytes = transport === "ble" ? bleSysExAssembler.receive(bytes) : Array.from(bytes || []);
        if(!cleanBytes)return;
        logHex("RX SysEx",cleanBytes);
        const parsed = AirFootCodec.parseSysExFrame(cleanBytes);

        if (parsed.valid) {
          if (parsed.kind === "INPUT_STATE") {
            inputMask = parsed.mask;
            for (let sw = 0; sw < 5; sw++) {
              const card = $(`swCard_${sw}`), down = Boolean(inputMask & (1 << sw));
              card.classList.toggle("input-down", down);
            }
            return;
          }
          if (!AirFootCodecBounds(parsed)) return;
          if (requests.receive(parsed)) return;
          if (localPreview) return;
          if (parsed.kind === "DEVICE_STATE" || parsed.kind === "EXPRESSION") {
            if (parsed.bank !== appState.activeBank) {
              expressionMapping = null; expressionTelemetry = false;
              appState.activeBank = parsed.bank; $("bankSelect").value = parsed.bank;
              $("exprValueText").textContent = "—"; $("exprBarFill").style.width = "0%";
              renderSwitches(); loadEditorFields();
              queueBankRefresh(parsed.bank);
            }
            if (parsed.kind === "DEVICE_STATE") {
              setCapabilities(parsed);
            }
            if (parsed.kind === "EXPRESSION") expressionTelemetry = true;
            showExpression(parsed.bank, parsed.channel, parsed.cc, parsed.value);
          } else if (parsed.kind === "ACTION_EVENT") {
            if (parsed.bank !== appState.activeBank) return;
            const tempoChord = inputMask === 0x06 && parsed.sw === 1 && parsed.gesture === 2 && parsed.type === 2 && parsed.code === 14;
            const looperChord = inputMask === 0x0c && parsed.sw === 2 && parsed.gesture === 3 && parsed.type === 2 && parsed.code === 15;
            if (tempoChord || looperChord) {
              const first = tempoChord ? 1 : 2;
              const name = tempoChord ? "Tap tempo" : "Looper / mute";
              operatorEvent(`Switches ${first + 1} + ${first + 2} · Chord recognized · ${name}`);
              flashCard(first); flashCard(first + 1);
              flashChordPill(tempoChord ? "chordTempoPill" : "chordLooperPill");
              return;
            }
            const gestNames = ["Tap recognized", "Double tap recognized", "Hold recognized"];
            const gestStr = gestNames[parsed.gesture] || "Tap";
            const actName = parsed.type === 7 ? `MCU · ${AirFootCodec.controlName(7,parsed.code)}`
              : AirFootCodec.ACTION_NAMES[parsed.type] || `Act ${parsed.type}`;
            logText(`RX ACTION: SW${parsed.sw + 1} (${PIN_LABELS[parsed.sw]}) ${gestStr} ➔ ${actName} (Code: ${parsed.code})`);
            const known = verified.has(slotKey(parsed.bank, parsed.sw, parsed.gesture))
              ? appState.banks[parsed.bank].switches[parsed.sw]?.[parsed.gesture] : null;
            const displayCode = parsed.type >= 5 ? (known && (known.code & 127) === parsed.code ? known.code : null) : parsed.code;
            operatorEvent(`Switch ${parsed.sw + 1} · ${gestStr} · ${actName}${parsed.type && displayCode !== null ? ` ${displayCode}` : ""}`);
            flashCard(parsed.sw);
          } else if (parsed.kind === "SELECT_BANK") {
            const previousBank = appState.activeBank;
            const logPayload = (parsed.frame && parsed.frame.length > 0) ? parsed.frame : cleanBytes;
            logHex(`RX ${parsed.kind}`, logPayload);
            appState.activeBank = parsed.bank;
            profileVerified.delete(parsed.bank);
            document.getElementById("bankSelect").value = parsed.bank;
            renderSwitches();
            loadEditorFields();
            expressionMapping = null; expressionTelemetry = false;
            queueBankRefresh(parsed.bank);
            operatorEvent(`Bank ${parsed.bank + 1} selected`);
            if (inputMask === 0x03) flashChordPill("chordDownPill");
            else if (inputMask === 0x18) flashChordPill("chordUpPill");
            else if (parsed.bank === (previousBank + 7) % 8) flashChordPill("chordDownPill");
            else if (parsed.bank === (previousBank + 1) % 8) flashChordPill("chordUpPill");
          }

        }
      }

      async function changeActiveBank(newBank) {
        newBank = (newBank + 8) % 8;

          appState.activeBank = newBank; $("bankSelect").value = newBank;

        }
        await operation(async () => {
          newBank = (newBank + 8) % 8;
          if (!Number.isInteger(newBank)) throw new Error("Invalid bank");
          await requests.request(AirFootCodec.encodeSelectBank(newBank), matching("ACK", newBank));
          appState.activeBank = newBank;
          document.getElementById("bankSelect").value = newBank;
          if (pendingBankRefresh === newBank) pendingBankRefresh = null;
          await readProfile(newBank);
          await readBankMappings(newBank);
          status("Bank selected and mappings read from device RAM. Persistence unverified (deferred NVS).");
        });
      }

      document.getElementById("btnSaveSlot").addEventListener("click", async () => {
        const updated = {
          bank: appState.activeBank,

          if (updated.type === 7 && (profileSupported !== true || !mcuAllowed())) throw new Error("MCU commands require a confirmed or explicitly drafted MCU profile");
          if (!AirFootCodec.validAction(updated, !fullByteMappings)) throw new Error("Invalid mapping or value exceeds the current 7-bit SysEx format");
          await requests.request(AirFootCodec.encodeWriteMapping(updated, fullByteMappings), matching("ACK", updated.bank, updated.sw, updated.gesture));
          const actual = await readSlot(updated.bank, updated.sw, updated.gesture);
          if (!["type", "chan_or_mod", "code", "val_on", "val_off"].every(k => actual[k] === updated[k])) {
            throw new Error("Mapping readback mismatch; prior confirmed state retained, device state uncertain");

      document.getElementById("btnReadSlot").addEventListener("click", async () => {

      document.getElementById("btnSyncBank").addEventListener("click", async () => {
        closeMenu();
        await operation(async () => {

          await readBankMappings(appState.activeBank);
          status("Bank mappings read from device RAM; expression mapping and persistence unverified.");
        });
      });


      /* Bank file operations use the existing serialized SysEx request path. */
      const sameAction=(a,b)=>["type","chan_or_mod","code","val_on","val_off"].every(k=>a[k]===b[k]);
      const sameProfile=(a,b)=>a.kind===b.kind&&a.name===b.name;
      const sameExpr=(a,b)=>a.channel===b.channel&&a.cc===b.cc;
      const sameBank=(a,b)=>sameProfile(a.profile,b.profile)&&sameExpr(a.expression,b.expression)&&
        a.switches.every((gs,sw)=>gs.every((a,g)=>sameAction(a,b.switches[sw][g])));
      const bankDrafts=bank=>profileDrafts.has(bank)||[...drafts.keys()].some(k=>k.startsWith(bank+"/"));
      function guardBank(bank,gen){
        if(!connected()||connectionGeneration!==gen||appState.activeBank!==bank)
          throw Error("Connection or selected bank changed; reconnect and compare again.");
      }
      async function readBankFile(bank){
        const gen=connectionGeneration;guardBank(bank,gen);
        const getState=()=>requests.request([240,125,7,0,247],p=>p.valid&&p.kind==="DEVICE_STATE");
        const state=await getState();guardBank(bank,gen);
        if(state.bank!==bank)throw Error("Pedal changed banks; select the destination and retry.");
        if(!(state.capabilities&4))throw Error("Updated bank-profile firmware required for complete bank files.");
        const profile=await readProfile(bank,false);guardBank(bank,gen);
        const switches=[];
        for(let sw=0;sw<5;sw++){
          const gs=[];
          for(let gesture=0;gesture<3;gesture++){
            const p=await requests.request(AirFootCodec.encodeReadRequest(bank,sw,gesture,Boolean(state.capabilities&1)),
              matching("READ_DUMP",bank,sw,gesture));
            guardBank(bank,gen);
            gs.push(Object.fromEntries(["type","chan_or_mod","code","val_on","val_off"].map(k=>[k,p[k]])));
          }
          switches.push(gs);
        }
        const final=await getState();guardBank(bank,gen);
        if(final.bank!==bank||final.channel!==state.channel||final.cc!==state.cc)
          throw Error("Selected bank or expression changed during read. Retry.");
        return AirFootCodec.importBankFile({format:"airfoot-bank",version:2,sourceBank:bank,
          profile,expression:{channel:state.channel,cc:state.cc},switches});
      }

      async function selectBankForTransfer(bank,generation){
        if(!connected()||connectionGeneration!==generation)throw Error("Pedal disconnected during configuration transfer");
        if(appState.activeBank!==bank){
          await requests.request(AirFootCodec.encodeSelectBank(bank),matching("ACK",bank));
          if(!connected()||connectionGeneration!==generation)throw Error("Pedal disconnected while changing bank");
          appState.activeBank=bank;
          $("bankSelect").value=bank;
        }
        const state=await requests.request([240,125,7,0,247],p=>p.valid&&p.kind==="DEVICE_STATE");
        if(!connected()||connectionGeneration!==generation||state.bank!==bank)
          throw Error("Pedal bank changed during transfer");
        return state;
      }
      async function restoreOriginalBank(bank,generation){
        if(!connected()||connectionGeneration!==generation)return false;
        try{
          await selectBankForTransfer(bank,generation);
          pendingBankRefresh=null;
          renderSwitches();loadEditorFields();
          return true;
        }catch(error){
          logText("Unable to restore original bank: "+error.message);
          return false;
        }
      }
      async function captureConfiguration(){
        const generation=connectionGeneration;
        const initial=await requests.request([240,125,7,0,247],
          p=>p.valid&&p.kind==="DEVICE_STATE");
        if(!connected()||generation!==connectionGeneration)throw Error("Pedal disconnected during Export");
        if(!(initial.capabilities&4)||!(initial.capabilities&2))
          throw Error("Firmware does not support complete profile and expression backup");
        const start=initial.bank, banks=[];
        let restoreOK=true;
        try{
          for(let bank=0;bank<8;bank++){
            if(!connected()||generation!==connectionGeneration)throw Error("Pedal disconnected during Export");
            await selectBankForTransfer(bank,generation);
            const current=await readBankFile(bank);
            banks.push({profile:current.profile,expression:current.expression,switches:current.switches});
            $("draftStatus").textContent=`Reading banks · ${bank+1}/8`;
          }
        }finally{
          restoreOK=await restoreOriginalBank(start,generation);
        }
        if(!restoreOK)throw Error("Bank selection could not be restored; Export incomplete");
        const final=await requests.request([240,125,7,0,247],
          p=>p.valid&&p.kind==="DEVICE_STATE");
        if(!connected()||generation!==connectionGeneration||final.bank!==start)
          throw Error("Final device check failed; Export incomplete");
        expressionTelemetry=false;showExpression(final.bank,final.channel,final.cc);
        $("exprValueText").textContent="—";$("exprBarFill").style.width="0%";
        return AirFootCodec.importConfigurationFile({format:"airfoot-configuration",version:1,activeBank:start,banks});
      }


      /* The protocol has no cross-bank commit. Keep a recovery file before the
       * first setting write, and verify each compensating write after a failure.
       * A lost connection or power interruption still requires manual recovery. */
      function downloadBankBackup(bankFile,bank){
        const blob=new Blob([AirFootCodec.exportBankFile(bankFile)],{type:"application/json"});
        const url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download="airfoot-bank"+(bank+1)+"-before-load.json";a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }
      async function restoreBankSnapshot(bank,target,generation,fullBytes){
        await selectBankForTransfer(bank,generation);
        const current=await readBankFile(bank),diff=differences(target,current);
        for(const {sw,gesture,action} of diff.mappings){
          guardBank(bank,generation);
          const desired={bank,sw,gesture,...action};
          await requests.request(AirFootCodec.encodeWriteMapping(desired,fullBytes),
            matching("ACK",bank,sw,gesture));
          const actual=await readSlot(bank,sw,gesture);
          if(!sameAction(actual,action))throw Error("Rollback mapping mismatch");
        }
        if(diff.expression){
          const {channel,cc}=target.expression;
          await requests.request([240,125,14,bank,channel,cc,bank^channel^cc,247],
            p=>p.valid&&p.kind==="EXPR_ACK"&&p.bank===bank);
          const state=await requests.request([240,125,7,0,247],
            p=>p.valid&&p.kind==="DEVICE_STATE");
          if(state.bank!==bank||state.channel!==channel||state.cc!==cc)
            throw Error("Rollback expression mismatch");
        }
        if(diff.profile){
          const desired={bank,...target.profile};
          await requests.request(AirFootCodec.encodeWriteProfile(desired),
            p=>p.valid&&p.kind==="PROFILE_ACK"&&p.bank===bank&&p.profileKind===desired.kind);
          const actual=await readProfile(bank,false);
          if(!sameProfile(actual,target.profile))throw Error("Rollback profile mismatch");
        }
        const final=await readBankFile(bank);
        if(!sameBank(final,target))throw Error("Rollback final readback mismatch");
        return final;
      }
      function installVerifiedBank(bank,actual){
        appState.banks[bank].switches=actual.switches.map(gs=>gs.map(a=>({...a})));
        appState.banks[bank].expr_ch=actual.expression.channel;
        appState.banks[bank].expr_cc=actual.expression.cc;
        profiles.set(bank,{...actual.profile});profileVerified.add(bank);
        for(let sw=0;sw<5;sw++)for(let gesture=0;gesture<3;gesture++)
          verified.add(slotKey(bank,sw,gesture));
      }

      /* Import backs up the full device before mapping writes and attempts verified
       * rollback on failure. No cross-bank atomicity or NVS durability is implied. */

      async function applyCompleteConfiguration(file){
        const generation=connectionGeneration;
        const state=await requests.request([240,125,7,0,247],
          p=>p.valid&&p.kind==="DEVICE_STATE");
        if(!connected()||generation!==connectionGeneration)throw Error("Pedal disconnected during Import");
        if(!(state.capabilities&4)||!(state.capabilities&2))
          throw Error("Firmware does not support complete profile and expression restore");
        const originalBank=state.bank,fullBytes=Boolean(state.capabilities&1);
        for(const bank of file.banks)
          for(const gestures of bank.switches)
            for(const action of gestures)
              if(!AirFootCodec.validAction(action,!fullBytes))
                throw Error("File contains mappings this pedal cannot accept");

        const backup=await captureConfiguration();
        if(!connected()||generation!==connectionGeneration||backup.activeBank!==originalBank)
          throw Error("Pedal changed during backup. No configuration imported.");
        const changed=file.banks.some((bank,i)=>!sameBank(bank,backup.banks[i]))||
          file.activeBank!==originalBank;
        if(changed)downloadConfiguration(backup,"airfoot-backup-before-import.json");
        let confirmed=0,changedBanks=0,touchedBank=-1;
        try{
          for(let bank=0;bank<8;bank++){
            await selectBankForTransfer(bank,generation);
            touchedBank=bank;
            const current=await readBankFile(bank);
            if(!sameBank(current,backup.banks[bank]))
              throw Error("Bank "+(bank+1)+" changed since backup");
            const requested=file.banks[bank];
            const diff=differences(requested,current);
            for(const {sw,gesture,action} of diff.mappings){
              guardBank(bank,generation);
              const desired={bank,sw,gesture,...action};
              await requests.request(AirFootCodec.encodeWriteMapping(desired,fullBytes),
                matching("ACK",bank,sw,gesture));
              const actual=await readSlot(bank,sw,gesture);
              if(!sameAction(actual,action))throw Error("Bank "+(bank+1)+", switch "+(sw+1)+": readback mismatch");
              guardBank(bank,generation);confirmed++;
            }
            if(diff.expression){
              guardBank(bank,generation);
              const {channel,cc}=requested.expression;
              await requests.request([240,125,14,bank,channel,cc,bank^channel^cc,247],
                p=>p.valid&&p.kind==="EXPR_ACK"&&p.bank===bank);
              const reply=await requests.request([240,125,7,0,247],
                p=>p.valid&&p.kind==="DEVICE_STATE");
              if(reply.bank!==bank||reply.channel!==channel||reply.cc!==cc)
                throw Error("Bank "+(bank+1)+": expression readback mismatch");
              guardBank(bank,generation);confirmed++;
            }
            if(diff.profile){
              guardBank(bank,generation);
              const desired={bank,...requested.profile};
              await requests.request(AirFootCodec.encodeWriteProfile(desired),
                p=>p.valid&&p.kind==="PROFILE_ACK"&&p.bank===bank&&p.profileKind===desired.kind);
              const actual=await readProfile(bank,false);
              if(!sameProfile(actual,requested.profile))
                throw Error("Bank "+(bank+1)+": control mode or name readback mismatch");
              guardBank(bank,generation);confirmed++;
            }
            const actual=await readBankFile(bank);
            if(!sameBank(requested,actual))throw Error("Bank "+(bank+1)+": final readback mismatch");
            installVerifiedBank(bank,actual);
            changedBanks++;
            $("draftStatus").textContent="Importing · "+changedBanks+"/8 banks";
          }
          if(!await restoreOriginalBank(file.activeBank,generation))
            throw Error("Selected bank could not be verified");
          const final=await requests.request([240,125,7,0,247],
            p=>p.valid&&p.kind==="DEVICE_STATE");
          if(!connected()||generation!==connectionGeneration||final.bank!==file.activeBank)
            throw Error("Selected bank readback mismatch");
          expressionTelemetry=false;showExpression(final.bank,final.channel,final.cc);
          $("exprValueText").textContent="—";$("exprBarFill").style.width="0%";
          renderSwitches();loadEditorFields();
          status("Imported all eight banks; "+confirmed+" changes read back in RAM. Power-cycle persistence not checked.");
        }catch(error){
          let recovered=false,rollbackError=null;
          try{
            if(!connected()||generation!==connectionGeneration)
              throw Error("Pedal disconnected");
            for(let bank=touchedBank;bank>=0;bank--){
              const actual=await restoreBankSnapshot(bank,backup.banks[bank],generation,fullBytes);
              installVerifiedBank(bank,actual);
            }
            if(!await restoreOriginalBank(originalBank,generation))
              throw Error("Original bank could not be reselected");
            const final=await requests.request([240,125,7,0,247],
              p=>p.valid&&p.kind==="DEVICE_STATE");
            if(final.bank!==originalBank)throw Error("Original bank readback mismatch");
            expressionTelemetry=false;showExpression(final.bank,final.channel,final.cc);
            $("exprValueText").textContent="—";$("exprBarFill").style.width="0%";
            recovered=true;
          }catch(failure){rollbackError=failure;}
          if(!recovered){verified.clear();profileVerified.clear();}
          renderSwitches();loadEditorFields();
          if(recovered)
            throw Error("Import failed; original settings restored. "+error.message);
          throw Error("Import incomplete; restore using airfoot-backup-before-import.json. "+
            error.message+"; rollback: "+(rollbackError?.message||"unavailable"));
        }
      }

      function downloadConfiguration(f,filename="airfoot-configuration-v1.json"){
        const blob=new Blob([AirFootCodec.exportConfigurationFile(f)],{type:"application/json"});
        const url=URL.createObjectURL(blob), a=document.createElement("a");
        a.href=url;a.download=filename;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }

      function differences(file,current){
        const mappings=[];
        for(let sw=0;sw<5;sw++)for(let gesture=0;gesture<3;gesture++)
          if(!sameAction(file.switches[sw][gesture],current.switches[sw][gesture]))
            mappings.push({sw,gesture,action:file.switches[sw][gesture]});
        return {mappings,profile:!sameProfile(file.profile,current.profile),
          expression:!sameExpr(file.expression,current.expression)};
      }
      function showBankFile(mode,bank){
        bankFileMode=mode;bankFileTarget=bank;bankFileCaptured=null;bankFileReviewed=null;
        $("bankFileConfirm").checked=false;$("bankFileConfirmWrap").hidden=true;
        $("btnBankFileApply").hidden=true;$("btnBankFileDownload").hidden=true;
        $("btnBankFileRead").textContent=mode==="save"?"Read bank from pedal":"Compare with pedal";
        $("bankFileIntro").textContent=mode==="save"
          ? `Bank ${bank+1}`
          : `Bank ${bankFileImported.sourceBank+1} → Bank ${bank+1}`;
        $("bankFileStatus").textContent=mode==="save"
          ?"Read to download"
          :"Compare before replacing";
        $("bankFileSummary").hidden=true;
        openDialog(mode==="save"?"Save bank":"Load bank","bankFilePanel");updateApply();
      }
      $("btnSaveBank").addEventListener("click",()=>{
        if(connected()&&!localPreview&&!operationBusy&&!connectionBusy)
          showBankFile("save",appState.activeBank);
      });
      $("btnLoadBank").addEventListener("click",()=>{
        if(connected()&&!localPreview&&!operationBusy&&!connectionBusy){
          closeMenu();$("bankLoadInput").click();
        }
      });
      $("bankLoadInput").addEventListener("change",event=>{
        const file=event.target.files[0];event.target.value="";
        if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{
          try{
            if(!connected()||localPreview||operationBusy||connectionBusy)
              throw Error("Connect before loading a bank.");
            bankFileImported=AirFootCodec.importBankFile(reader.result);
            showBankFile("load",appState.activeBank);
          }catch(error){status(error.message);}
        };
        reader.readAsText(file);
      });
      $("btnBankFileRead").addEventListener("click",async()=>{
        if(!connected()||operationBusy||connectionBusy||localPreview||bankFileTarget!==appState.activeBank)return;
        const mode=bankFileMode,bank=bankFileTarget;
        bankFileCaptured=null;bankFileReviewed=null;
        $("btnBankFileDownload").hidden=true;$("btnBankFileApply").hidden=true;
        $("bankFileConfirmWrap").hidden=true;$("bankFileConfirm").checked=false;
        $("bankFileSummary").hidden=true;
        await operation(async()=>{
          try{
            const current=await readBankFile(bank);
            if(mode==="save"){
              bankFileCaptured=current;$("btnBankFileDownload").hidden=false;
              $("bankFileStatus").textContent="Ready to download";
              status(`Bank ${bank+1} verified in device RAM. File ready; persistence unverified.`);
            }else{
              const diff=differences(bankFileImported,current);
              bankFileReviewed={generation:connectionGeneration,current,diff};
              const count=diff.mappings.length+Number(diff.expression)+Number(diff.profile);
              $("bankFileSummary").textContent=`Bank ${bank+1} · ${count} ${count===1?"change":"changes"}`;
              $("bankFileSummary").hidden=false;$("btnBankFileApply").hidden=false;
              $("btnBankFileApply").textContent=`Apply to Bank ${bank+1}`;
              $("bankFileConfirmWrap").hidden=false;
              $("bankFileStatus").textContent=bankDrafts(bank)
                ?"Save or discard your edits first"
                :"Confirm replacement";
              status(`Bank ${bank+1} compared; nothing written.`);
            }
          }catch(error){$("bankFileStatus").textContent=friendlyStatus(error.message);throw error;}
        });
      });
      $("bankFileConfirm").addEventListener("change",updateApply);
      $("btnBankFileDownload").addEventListener("click",()=>{
        if(!bankFileCaptured||operationBusy||connectionBusy)return;
        const url=URL.createObjectURL(new Blob([AirFootCodec.exportBankFile(bankFileCaptured)],
          {type:"application/json"}));
        const a=document.createElement("a");a.href=url;
        a.download=`airfoot-bank${bankFileCaptured.sourceBank+1}-v2.json`;
        a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
        $("bankFileStatus").textContent="Bank saved";
      });
      $("btnBankFileApply").addEventListener("click",async()=>{
        const review=bankFileReviewed,bank=bankFileTarget;
        if(!review||bankFileMode!=="load"||!$("bankFileConfirm").checked||
           bank!==appState.activeBank||review.generation!==connectionGeneration||
           bankDrafts(bank)||!connected()||localPreview||operationBusy||connectionBusy){
          $("bankFileStatus").textContent="Check bank and unsaved changes";
          return;
        }
        const diff=review.diff;
        const total=diff.mappings.length+Number(diff.profile)+Number(diff.expression);
        let done=0,rollbackArmed=false;
        await operation(async()=>{
          try{
            guardBank(bank,review.generation);
            const current=await readBankFile(bank);
            if(!sameBank(current,review.current))
              throw Error("Destination changed since comparison. Compare again.");
            if(diff.mappings.some(({action})=>!AirFootCodec.validAction(action,!fullByteMappings)))
              throw Error("Mapping cannot be sent using this device's supported protocol.");
            if(total>0){
              downloadBankBackup(current,bank);
              rollbackArmed=true;
            }
            for(const {sw,gesture,action} of diff.mappings){
              guardBank(bank,review.generation);
              const desired={bank,sw,gesture,...action};
              await requests.request(AirFootCodec.encodeWriteMapping(desired,fullByteMappings),
                matching("ACK",bank,sw,gesture));
              const actual=await readSlot(bank,sw,gesture);
              if(!sameAction(actual,action))throw Error(`Switch ${sw+1} gesture ${gesture} readback mismatch`);
              guardBank(bank,review.generation);
              applySlot(actual);done++;
              $("bankFileStatus").textContent=`Restoring · ${done}/${total}`;
            }
            if(diff.expression){
              guardBank(bank,review.generation);
              const {channel,cc}=bankFileImported.expression;
              await requests.request([240,125,14,bank,channel,cc,bank^channel^cc,247],
                p=>p.valid&&p.kind==="EXPR_ACK"&&p.bank===bank);
              const state=await requests.request([240,125,7,0,247],
                p=>p.valid&&p.kind==="DEVICE_STATE");
              if(state.bank!==bank||state.channel!==channel||state.cc!==cc)
                throw Error("Expression readback mismatch");
              guardBank(bank,review.generation);
              expressionMapping={bank,channel,cc};done++;
            }
            if(diff.profile){
              guardBank(bank,review.generation);
              const desired={bank,...bankFileImported.profile};
              await requests.request(AirFootCodec.encodeWriteProfile(desired),
                p=>p.valid&&p.kind==="PROFILE_ACK"&&p.bank===bank&&p.profileKind===desired.kind);
              const actual=await readProfile(bank,false);
              if(!sameProfile(actual,desired))throw Error("Profile readback mismatch");
              guardBank(bank,review.generation);
              profiles.set(bank,actual);profileVerified.add(bank);done++;
            }
            const final=await readBankFile(bank);
            if(!sameBank(final,bankFileImported))throw Error("Final bank verification mismatch");
            for(let sw=0;sw<5;sw++)for(let g=0;g<3;g++){
              appState.banks[bank].switches[sw][g]={...final.switches[sw][g]};
              verified.add(slotKey(bank,sw,g));
            }
            appState.banks[bank].expr_ch=final.expression.channel;
            appState.banks[bank].expr_cc=final.expression.cc;
            profiles.set(bank,{...final.profile});profileVerified.add(bank);
            expressionMapping={bank,channel:final.expression.channel,cc:final.expression.cc};
            bankFileReviewed=null;$("bankFileConfirm").checked=false;
            $("bankFileConfirmWrap").hidden=true;$("btnBankFileApply").hidden=true;
            $("bankFileStatus").textContent=`Bank restored · ${done} ${done===1?"change":"changes"}`;
            renderSwitches();loadEditorFields();
            status(`Bank ${bank+1} restored and read back. Persistence unverified.`);
          }catch(error){
            bankFileReviewed=null;$("bankFileConfirm").checked=false;
            $("btnBankFileApply").hidden=true;
            let recovered=false,rollbackError=null;
            if(rollbackArmed){
              try{
                const actual=await restoreBankSnapshot(bank,review.current,review.generation,fullByteMappings);
                installVerifiedBank(bank,actual);
                expressionMapping={bank,channel:actual.expression.channel,cc:actual.expression.cc};
                recovered=true;
              }catch(failure){rollbackError=failure;}
            }
            if(!recovered){verified.clear();profileVerified.delete(bank);}
            renderSwitches();loadEditorFields();
            $("bankFileStatus").textContent=recovered?"Original bank restored":"Restore incomplete";
            if(recovered)throw Error("Restore stopped; original bank restored. "+error.message);
            if(!rollbackArmed)throw Error("Restore stopped: "+error.message);
            throw Error("Restore incomplete; load airfoot-bank"+(bank+1)+"-before-load.json. "+
              error.message+"; rollback: "+(rollbackError?.message||"unavailable"));
          }
        });
      });

      document.getElementById("btnExportJson").addEventListener("click",async()=>{
        closeMenu();
        if(!connected()||operationBusy||connectionBusy||localPreview){
          status("Connect your pedal before exporting");return;
        }
        await operation(async()=>{
          const captured=await captureConfiguration();
          downloadConfiguration(captured);
          status("All eight banks read and exported; power-cycle persistence not checked.");
        });
      });

      document.getElementById("btnImportJson").addEventListener("click", () => {
        closeMenu(); document.getElementById("fileImportInput").click();
      });

      document.getElementById("fileImportInput").addEventListener("change",e=>{
        const file=e.target.files[0];e.target.value="";
        if(!file)return;
        const reader=new FileReader();
        reader.onload=async()=>{
          try{
            if(!connected()||operationBusy||connectionBusy||localPreview)
              throw Error("Connect your pedal before importing");
            const imported=AirFootCodec.importConfigurationFile(reader.result);
            if(drafts.size||profileDrafts.size){
              if(!confirm("Discard unsaved edits and import?"))
                return;
              drafts.clear();profileDrafts.clear();
            }
            await operation(async()=>applyCompleteConfiguration(imported));
          }catch(error){status(error.message||String(error));}
        };
        reader.onerror=()=>status("Could not read the configuration file");
        reader.readAsText(file);
      });

      document.getElementById("btnBleConnect").addEventListener("click", async () => {
        if (connectionBusy || operationBusy) return;
        connectionBusy = true;
        updateApply();
        try {
          beginConnection();
          if (navigator.bluetooth.getAvailability && !await navigator.bluetooth.getAvailability())
            throw new Error("Bluetooth adapter unavailable. Turn on Bluetooth and retry.");
          logText("Bluetooth requestDevice: AirFoot name filter; optional MIDI service");
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "AirFoot" }],
            optionalServices: [AirFootCodec.MIDI_SERVICE_UUID]
          });
          bleDevice = device;
          device.addEventListener("gattserverdisconnected", () => {
            if (bleDevice === device) transportLost();
          });
          logText("Bluetooth device selected; connecting GATT");
          const server = await device.gatt.connect();
          const midiSvc = await server.getPrimaryService(AirFootCodec.MIDI_SERVICE_UUID);
          bleMidiChar = await midiSvc.getCharacteristic(AirFootCodec.MIDI_CHAR_UUID);
          const characteristic = bleMidiChar;
          bleNotification = ev => {
            if (bleDevice !== device || bleMidiChar !== characteristic) return;
            const value = ev.target.value;
            handleIncomingMidiPacket(new Uint8Array(value.buffer, value.byteOffset, value.byteLength), "ble");
          };
          bleMidiChar.addEventListener("characteristicvaluechanged", bleNotification);
          await bleMidiChar.startNotifications();
          if (bleDevice !== device || !device.gatt.connected) throw new Error("Bluetooth disconnected during setup");
          /* GATT subscription alone does not establish a usable settings session.
           * Require the same read-only device handshake as USB WebMIDI. */
          const state = await requests.request([0xf0,0x7d,0x07,0,0xf7],
            parsed => parsed.valid && parsed.kind === "DEVICE_STATE");
          if (bleDevice !== device || !device.gatt.connected ||
              !Number.isInteger(state.bank) || state.bank < 0 || state.bank >= 8)
            throw new Error("AirFoot did not respond with valid settings");
          setCapabilities(state);
          appState.activeBank = state.bank;
          $("bankSelect").value = state.bank;
          expressionMapping = {bank:state.bank,channel:state.channel,cc:state.cc};
          expressionTelemetry = false;
          renderSwitches();loadEditorFields();
          closeDialog();
          status("Connected. Reading your pedal settings…");

          document.getElementById("connStatus").textContent = "Bluetooth";
          operatorEvent("Pedal connected via Bluetooth"); renderConnection();
        } catch (err) {
          transportLost();
          console.warn("WebBluetooth error:", err);
          const line = document.createElement("div");
          line.style.color = "#f87171";
          line.textContent = connectionError("Bluetooth", err);
          status(line.textContent);
          sysexLog.prepend(line);
        while (sysexLog.children.length > 200) sysexLog.lastChild.remove();
        } finally {
          connectionBusy = false; updateApply();
          if (connected()) await synchronizeConnectedBank();
        }
      });

      function connectionError(method, error) {
        logText(`${method}: ${error.name || "Error"}: ${error.message || error}`);
        if (method === "MIDI" && ["NotAllowedError", "SecurityError"].includes(error.name)) {
          midiDenied = true; updateApply();
          return "MIDI permission denied";
        }
        if (method === "Bluetooth" && /unsupported|not supported|gatt/i.test(error.message || ""))
          return "Bluetooth connection failed.";
        if (["NotAllowedError", "SecurityError"].includes(error.name))
          return "Permission denied";
        if (error.message?.startsWith("Bluetooth adapter unavailable")) return "Turn on Bluetooth";
        if (error.name === "NotFoundError") return "Pedal not found";
        return "Connection failed";
      }
      function midiPortIsUsb(port) {
        return /(?:USB MIDI|MIDI 2\.0)/i.test(port?.name || "");
      }
      function airFootPortPairs(access) {
        const ins = Array.from(access.inputs.values()).filter(AirFootCodec.isAirFootPort);
        const outs = Array.from(access.outputs.values()).filter(AirFootCodec.isAirFootPort);
        const pairs = [];
        for (const input of ins) {
          const matches = outs.filter(output => output.name === input.name);
          if (matches.length === 1 && ins.filter(other => other.name === input.name).length === 1)
            pairs.push({input,output:matches[0]});
        }
        return pairs.sort((a,b) => Number(!midiPortIsUsb(a.input)) - Number(!midiPortIsUsb(b.input)));
      }
      function refreshMidiPorts() {
        for (const [id, ports] of [["midiInput", midiAccess.inputs], ["midiOutput", midiAccess.outputs]]) {
          const select = $(id), previous = select.value;
          select.replaceChildren(new Option("Choose AirFoot", ""));
          for (const [key, port] of ports) {
            if (AirFootCodec.isAirFootPort(port)) select.add(new Option(port.name || "AirFoot", key));
          }
          select.value = previous;
        }
        const pairs = airFootPortPairs(midiAccess);
        $("midiPorts").hidden = connected() || pairs.length > 0 ||
          !Array.from(midiAccess.inputs.values()).some(AirFootCodec.isAirFootPort) ||
          !Array.from(midiAccess.outputs.values()).some(AirFootCodec.isAirFootPort);
        logText("MIDI discovery: " + midiAccess.inputs.size + " input(s), " + midiAccess.outputs.size + " output(s)");
      }
      async function useMidi(input, output) {
        if (!input || !output || input.state === "disconnected" || output.state === "disconnected")
          throw new Error("AirFoot MIDI connection unavailable.");
        transportLost();
        try {
          await Promise.all([input.open?.(), output.open?.()]);
          if (input.state === "disconnected" || output.state === "disconnected")
            throw new Error("MIDI port disconnected while opening");
        } catch (error) {
          await Promise.allSettled([input.close?.(), output.close?.()]);
          throw error;
        }
        requests = AirFootCodec.createRequests(transmitSysEx);
        webMidiIn = input; webMidiOut = output;
        input.onmidimessage = msg => { if (webMidiIn === input) handleIncomingMidiPacket(msg.data, "midi"); };
        let state;
        try {
          /* A visible port is not proof that the pedal accepts configuration. */
          state = await requests.request([0xf0,0x7d,0x07,0,0xf7],
            parsed => parsed.valid && parsed.kind === "DEVICE_STATE");
        } catch (error) {
          transportLost();
          if (midiPortIsUsb(input))
            throw new Error("AirFoot did not respond.");
          throw new Error("AirFoot did not respond.");
        }
        if (state.bank < 0 || state.bank >= 8) {
          transportLost();
          throw new Error("AirFoot returned invalid settings. Reconnect and retry.");
        }
        setCapabilities(state);
        appState.activeBank = state.bank;
        $("bankSelect").value = state.bank;
        expressionMapping = {bank:state.bank, channel:state.channel, cc:state.cc};
        expressionTelemetry = false;
        renderSwitches(); loadEditorFields();
        midiReconnect = {inputId:input.id, outputId:output.id, inputName:input.name, outputName:output.name};
        $("exprLabel").textContent = "Awaiting signal";
        $("connStatus").textContent = midiPortIsUsb(input) ? "USB" : "Bluetooth";
        closeDialog();
        status("Connected. Reading your pedal settings…");
        renderConnection();
        operatorEvent("Pedal connected");
      }
      async function connectBestMidiPair(access) {
        const pairs = airFootPortPairs(access);
        for (const pair of pairs) {
          try { await useMidi(pair.input, pair.output); return true; }
          catch (error) { logText("AirFoot " + pair.input.name + ": " + error.message); }
        }
        const usbPresent = Array.from(access.inputs.values()).some(port =>
          AirFootCodec.isAirFootPort(port) && midiPortIsUsb(port));
        status(usbPresent
          ? "Could not connect to AirFoot."
          : "AirFoot not connected.");
        return false;
      }
      document.getElementById("btnUseMidi").addEventListener("click", async () => {
        if (connectionBusy || operationBusy || !midiAccess) return;
        connectionBusy = true;
        updateApply();
        try {
          await useMidi(midiAccess.inputs.get(document.getElementById("midiInput").value),
            midiAccess.outputs.get(document.getElementById("midiOutput").value));
        } catch (error) { transportLost(); status(connectionError("MIDI", error)); }
        finally {
          connectionBusy = false; updateApply();
          if (connected()) await synchronizeConnectedBank();
        }
      });
      document.getElementById("btnMidiConnect").addEventListener("click", async () => {
        if (connectionBusy || operationBusy) return;
        connectionBusy = true;
        updateApply();
        try {
          beginConnection();
          if (midiDenied) throw new DOMException("Previously denied", "NotAllowedError");
          const permission = await navigator.permissions?.query({name:"midi", sysex:true}).catch(() => null);
          logText(`MIDI permission before request: ${permission?.state || "unknown"}`);
          if (permission?.state === "denied") throw new DOMException("Previously denied in site settings", "NotAllowedError");
          logText("MIDI requestMIDIAccess: SysEx required");
          const access = await navigator.requestMIDIAccess({ sysex: true });
          if (access.sysexEnabled === false) throw new DOMException("SysEx required", "NotAllowedError");
          midiAccess = access;
          access.onstatechange = async () => {
            if (midiAccess !== access) return;
            if (webMidiIn && (webMidiIn.state === "disconnected" || webMidiOut.state === "disconnected" ||
                !Array.from(access.inputs.values()).includes(webMidiIn) || !Array.from(access.outputs.values()).includes(webMidiOut))) {
              transportLost();
              status("Disconnected. Connection lost.");
            }
            refreshMidiPorts();
            if (midiReconnect && !webMidiIn && (connectionBusy || operationBusy)) {
              setTimeout(() => {
                if (midiAccess === access && midiReconnect) access.onstatechange?.();
              }, 250);
            }
            if (midiReconnect && !webMidiIn && !midiReconnecting && !connectionBusy && !operationBusy) {
              const match = (ports, id, name) => {
                const candidates = Array.from(ports.values()).filter(port => port.state !== "disconnected" &&
                  (port.id === id || (port.name === name && AirFootCodec.isAirFootPort(port))));
                return candidates.length === 1 ? candidates[0] : null;
              };
              const input = match(access.inputs, midiReconnect.inputId, midiReconnect.inputName);
              const output = match(access.outputs, midiReconnect.outputId, midiReconnect.outputName);
              if (input && output) {
                midiReconnecting = true;
                try { await useMidi(input, output); }
                catch (error) { status(connectionError("MIDI", error)); }
                finally {
                  midiReconnecting = false; updateApply();
                  if (connected()) await synchronizeConnectedBank();
                }
              }
            }
          };
          refreshMidiPorts();
          await connectBestMidiPair(access);
        } catch (error) { transportLost(); status(connectionError("MIDI", error)); }
        finally {
          connectionBusy = false; updateApply();
          if (connected()) await synchronizeConnectedBank();
        }
      });

      const secure = window.isSecureContext;
      const bluetoothAvailable = Boolean(navigator.bluetooth?.requestDevice);
      const midiAvailable = Boolean(navigator.requestMIDIAccess);
      $("bleHelp").textContent = !secure ? "Requires HTTPS" : bluetoothAvailable ? "" : "Unavailable";
      $("midiHelp").textContent = !secure ? "Requires HTTPS" : midiAvailable ? "" : "Unavailable";
      if (secure && midiAvailable) {
        $("btnMidiConnect").classList.add("primary");
        $("btnMidiConnect").querySelector(".transport-title").textContent = "USB";
        $("midiHelp").textContent = "";
        if (bluetoothAvailable) $("bleHelp").textContent = "";
        $("btnMidiConnect").parentNode.insertBefore($("btnMidiConnect"), $("btnBleConnect"));
      }
      $("compatInfo").textContent = !secure ? "Open using HTTPS or localhost"
        : !bluetoothAvailable && !midiAvailable ? "Connection unavailable in this browser" : "";
      $("compatInfo").hidden = !$("compatInfo").textContent;
      if (secure && navigator.serviceWorker?.register) {
        navigator.serviceWorker.register("./sw.js", {scope: "./"}).then(registration => {
          const offer = () => { if (registration.waiting) document.getElementById("btnReload").hidden = false; };
          offer();
          registration.addEventListener("updatefound", () => {
            registration.installing?.addEventListener("statechange", () => {
              offer();
              if (registration.active || registration.waiting)
                document.getElementById("offlineStatus").textContent = "Application shell installed for offline use. Hardware access still requires browser support.";
            });
          });
          document.getElementById("offlineStatus").textContent = registration.active ? "Offline application shell available." : "Installing offline application shell…";
          document.getElementById("btnReload").addEventListener("click", () => {
            if (operationBusy || connectionBusy) { status("Busy. Try again"); return; }
            if (!confirm("Reload and discard unsaved edits?")) return;
            if (registration.waiting) {
              navigator.serviceWorker.addEventListener("controllerchange", () => location.reload(), {once: true});
              registration.waiting.postMessage({type: "ACTIVATE"});
            } else location.reload();
          });
        }).catch(error => { document.getElementById("offlineStatus").textContent = `Offline installation unavailable: ${error.message}`; });
      } else document.getElementById("offlineStatus").textContent = "Offline installation unavailable in this browser or context.";

      renderSwitches();
      loadEditorFields();
      renderConnection();
      navigator.permissions?.query({name:"midi", sysex:true}).then(permission => {
        if (permission.state === "denied") { midiDenied = true; renderConnection(); }
        else if (permission.state === "granted" && secure && midiAvailable && !connected() &&
                 !connectionBusy && !operationBusy && !localPreview)
          $("btnMidiConnect").click();
      }).catch(() => {});
    })();
  </script>
</body>
</html>
