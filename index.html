<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f6f7f9; color: #20242c; font: 400 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { padding: 2rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 500; letter-spacing: -.06em; }
    @media (prefers-color-scheme: dark) { body { background: #111318; color: #f2f3f5; } }
  </style>
</head>
<body>
  <main><h1>Welcome.</h1></main>
</body>
</html>
